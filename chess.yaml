# YOLO dataset config for chess pieces.
# Put your dataset in ./datasets/chess with this layout:
#   datasets/chess/train/images  datasets/chess/train/labels
#   datasets/chess/valid/images  datasets/chess/valid/labels
path: datasets/chess
train: train/images
val: valid/images

names:
  0: black-bishop
  1: black-king
  2: black-knight
  3: black-pawn
  4: black-queen
  5: black-rook
  6: white-bishop
  7: white-king
  8: white-knight
  9: white-pawn
  10: white-queen
  11: white-rook
